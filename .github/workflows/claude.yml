name: Claude Code Assistant

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned'))

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Extract issue context and post acknowledgement
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            let rawTask, issueNumber, issueTitle;

            if (context.eventName === 'issue_comment') {
              rawTask    = context.payload.comment.body.replace(/@claude/gi, '').trim();
              issueNumber = context.payload.issue.number;
              issueTitle  = context.payload.issue.title;
            } else {
              issueTitle  = context.payload.issue.title;
              rawTask     = context.payload.issue.body || issueTitle;
              issueNumber = context.payload.issue.number;
            }

            // Build a rich task prompt with full issue context
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const fullContext = [
              `GitHub Issue #${issueNumber}: ${issueTitle}`,
              ``,
              `Issue body:`,
              issueData.data.body || '(no description)',
              ``,
              `Task requested:`,
              rawTask
            ].join('\n');

            const fs = require('fs');
            fs.writeFileSync('/tmp/claude-task.txt', fullContext);

            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('issue_title', issueTitle);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🤖 Claude is working on **#${issueNumber}**...`
            });

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat /tmp/claude-task.txt)" \
            --allowedTools "Edit,Write,Read,Bash,Glob,Grep,TodoWrite" \
            --max-turns 15 \
            --output-format text \
            2>&1 | tee /tmp/claude-output.txt

      - name: Commit changes and open PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const issueNumber = '${{ steps.ctx.outputs.issue_number }}';
            const issueTitle  = '${{ steps.ctx.outputs.issue_title }}';
            const claudeOutput = fs.readFileSync('/tmp/claude-output.txt', 'utf8').slice(0, 2000);

            // Check for changes
            const diff = execSync('git status --porcelain').toString().trim();

            if (!diff) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(issueNumber),
                body: `✅ Claude reviewed issue #${issueNumber} but found no code changes needed.\n\n<details><summary>Claude's response</summary>\n\n${claudeOutput}\n\n</details>`
              });
              return;
            }

            // Create branch, commit, push
            const branch = `claude/issue-${issueNumber}-${Date.now()}`;
            execSync(`git checkout -b ${branch}`);
            execSync('git add -A');
            execSync(`git commit -m "claude: address issue #${issueNumber}"`);
            execSync(`git push origin ${branch}`);

            // Open PR
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Claude: ${issueTitle.slice(0, 60)}`,
              body: `Closes #${issueNumber}\n\nGenerated by Claude Code.\n\n<details><summary>Claude's response</summary>\n\n${claudeOutput}\n\n</details>`,
              head: branch,
              base: 'main'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(issueNumber),
              body: `✅ Done! PR ready for review: ${pr.data.html_url}`
            });
